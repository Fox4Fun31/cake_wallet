name: Build Windows

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to build (tag/branch/sha)'
        required: false
        default: 'v6.1.2'

jobs:
  build-natives:
    name: Fetch native libs (Linux)
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || 'v6.1.2' }}
          submodules: recursive
          fetch-depth: 1

      - name: Install minimal deps (curl, unzip, mingw runtime for libssp/libwinpthread)
        run: |
          sudo apt-get update
          sudo apt-get install -y curl unzip gcc-mingw-w64-x86-64 wget

      - name: Fetch prebuilt Torch Dart
        run: |
          set -x -e
          cd scripts
          rm -rf torch_dart
          wget -q https://github.com/MrCyjaneK/torch_dart/releases/download/v1.0.17/torch_dart-v1.0.17.tar.gz -O torch_dart.tar.gz
          mkdir torch_dart
          tar -xzf torch_dart.tar.gz -C torch_dart
          rm torch_dart.tar.gz
          ls torch_dart | head -5

      - name: Fetch prebuilt Reown Flutter
        run: |
          set -x -e
          cd scripts
          rm -rf reown_flutter
          wget -q https://github.com/cake-tech/reown_flutter/releases/download/v0.0.4/reown_flutter-v0.0.4.tar.gz -O reown_flutter.tar.gz
          mkdir reown_flutter
          tar -xzf reown_flutter.tar.gz -C reown_flutter
          rm reown_flutter.tar.gz
          ls reown_flutter | head -5

      - name: Clone bitbox_flutter (pub-get path dep, no native build needed)
        run: |
          set -x -e
          cd scripts
          rm -rf bitbox_flutter
          git clone https://github.com/konstantinullrich/bitbox_flutter
          cd bitbox_flutter
          git checkout 5a6e6dd388ef64003f86094af80d5453518b601d
          ls | head -10

      - name: Fetch prebuilt monero_c bundle + map to old layout
        run: |
          set -x -e
          # Download the prebuilt monero_c release bundle (saves 1-3h source build).
          # cake_wallet's windows/CMakeLists.txt at v6.1.2 still expects the OLD layout:
          #   release/monero/x86_64-w64-mingw32_libwallet2_api_c.dll
          #   release/wownero/x86_64-w64-mingw32_libwallet2_api_c.dll
          #   release/monero/x86_64-w64-mingw32_libssp-0.dll
          #   release/monero/x86_64-w64-mingw32_libwinpthread-1.dll
          # Bundle now provides:
          #   x86_64-w64-mingw32/lib{monero,wownero}_wallet2_api_c.dll
          mkdir -p /tmp/monerc && cd /tmp/monerc
          curl -sL -o release-bundle.zip "https://github.com/MrCyjaneK/monero_c/releases/download/v0.18.4.6-RC1/release-bundle.zip"
          unzip -q release-bundle.zip
          rm release-bundle.zip
          cd "$GITHUB_WORKSPACE"
          mkdir -p scripts/monero_c/release/monero scripts/monero_c/release/wownero
          cp -v /tmp/monerc/x86_64-w64-mingw32/libmonero_wallet2_api_c.dll  scripts/monero_c/release/monero/x86_64-w64-mingw32_libwallet2_api_c.dll
          cp -v /tmp/monerc/x86_64-w64-mingw32/libwownero_wallet2_api_c.dll scripts/monero_c/release/wownero/x86_64-w64-mingw32_libwallet2_api_c.dll
          # libssp-0.dll + libwinpthread-1.dll from mingw-w64 runtime
          LIBSSP=$(find /usr -name 'libssp-0.dll' 2>/dev/null | head -1)
          LIBWINPTHREAD=$(find /usr -name 'libwinpthread-1.dll' 2>/dev/null | head -1)
          echo "libssp-0.dll: $LIBSSP"
          echo "libwinpthread-1.dll: $LIBWINPTHREAD"
          if [ -n "$LIBSSP" ]; then
            cp -v "$LIBSSP" scripts/monero_c/release/monero/x86_64-w64-mingw32_libssp-0.dll
          else
            echo "::warning::libssp-0.dll not found, patching CMakeLists.txt to skip"
            sed -i '/x86_64-w64-mingw32_libssp-0\.dll/,/COMPONENT Runtime)/d' windows/CMakeLists.txt
          fi
          if [ -n "$LIBWINPTHREAD" ]; then
            cp -v "$LIBWINPTHREAD" scripts/monero_c/release/monero/x86_64-w64-mingw32_libwinpthread-1.dll
          else
            echo "::warning::libwinpthread-1.dll not found, patching CMakeLists.txt to skip"
            sed -i '/x86_64-w64-mingw32_libwinpthread-1\.dll/,/COMPONENT Runtime)/d' windows/CMakeLists.txt
          fi
          echo "--- release/monero ---"
          ls -lh scripts/monero_c/release/monero/
          echo "--- release/wownero ---"
          ls -lh scripts/monero_c/release/wownero/

      - name: Strip broken/unused dirs before tar (Win can't extract bad symlinks)
        run: |
          set -x
          # Examples + Android dirs have symlinks pointing to non-existent paths
          rm -rf scripts/bitbox_flutter/example scripts/bitbox_flutter/android
          rm -rf scripts/reown_flutter/packages/reown_appkit/example
          rm -rf scripts/reown_flutter/packages/reown_walletkit/example
          rm -rf scripts/reown_flutter/packages/reown_core/example 2>/dev/null || true
          # Sweep any remaining broken symlinks just in case
          find . -xtype l -print -delete 2>/dev/null || true

      - name: Package workspace for Windows job
        run: |
          tar --exclude='.git' --exclude='**/.git' --exclude='scripts/monero_c/monero' --exclude='scripts/monero_c/wownero' --exclude='scripts/monero_c/zano' -cf /tmp/workspace.tar .
          ls -lh /tmp/workspace.tar

      - name: Upload workspace artifact
        uses: actions/upload-artifact@v4
        with:
          name: cake-wallet-workspace
          path: /tmp/workspace.tar
          retention-days: 1
          compression-level: 1

  build-app:
    name: Build Flutter Windows app
    needs: build-natives
    runs-on: windows-2022
    timeout-minutes: 180
    steps:
      - name: Download workspace
        uses: actions/download-artifact@v4
        with:
          name: cake-wallet-workspace
          path: ${{ runner.temp }}

      - name: Extract workspace
        shell: bash
        run: |
          # GNU tar parses "D:\..." as remote host. Workarounds:
          # 1) --force-local for the archive path
          # 2) cd into target instead of -C "<windows-path>"
          cd "$GITHUB_WORKSPACE"
          tar --force-local -xf "$RUNNER_TEMP/workspace.tar"
          ls | head -40

      - name: Setup Flutter 3.32.0
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.0'
          channel: stable
          cache: true

      - name: Setup NuGet
        run: |
          New-Item -ItemType Directory -Force -Path "C:\Program Files\Nuget" | Out-Null
          Invoke-WebRequest -Uri "https://dist.nuget.org/win-x86-commandline/latest/nuget.exe" -OutFile "C:\Program Files\Nuget\nuget.exe"
          Add-Content -Path $env:GITHUB_PATH -Value "C:\Program Files\Nuget"

      - name: Locate VC++ Redist (prefer System32, no path-spaces)
        id: vcredist
        shell: pwsh
        run: |
          # System32 always has msvcp140 + vcruntime140 on Win Server runners,
          # AND has no spaces in path (avoids cmd parsing issues in cakewallet.bat).
          # Fallback: search VS install if missing.
          $sys32 = "C:\Windows\System32"
          $hasAll = (Test-Path "$sys32\msvcp140.dll") -and (Test-Path "$sys32\vcruntime140.dll") -and (Test-Path "$sys32\vcruntime140_1.dll")
          if ($hasAll) {
            $path = $sys32
          } else {
            $roots = @(
              "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Redist\MSVC",
              "C:\Program Files\Microsoft Visual Studio\2022\Community\VC\Redist\MSVC",
              "C:\Program Files\Microsoft Visual Studio\2022\Professional\VC\Redist\MSVC",
              "C:\Program Files\Microsoft Visual Studio\2022\BuildTools\VC\Redist\MSVC"
            ) | Where-Object { Test-Path $_ }
            $found = $null
            foreach ($root in $roots) {
              $latestVer = Get-ChildItem -Path $root -Directory | Sort-Object Name -Descending | Select-Object -First 1
              if (-not $latestVer) { continue }
              $crtDir = Get-ChildItem -Path $latestVer.FullName -Recurse -Directory | Where-Object { $_.Name -like "*VC*CRT" -and $_.FullName -match "x64" } | Select-Object -First 1
              if ($crtDir -and (Test-Path (Join-Path $crtDir.FullName "msvcp140.dll"))) { $found = $crtDir.FullName; break }
            }
            if (-not $found) { Write-Error "VC++ Redist not found"; exit 1 }
            $path = $found
          }
          Write-Host "VC++ Redist path: $path"
          "path=$path" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Patch cakewallet.bat to dequote arg (%1 -> %~1)
        shell: pwsh
        run: |
          $p = "cakewallet.bat"
          $c = Get-Content $p -Raw
          $c = $c -replace 'set tools_root=%1', 'set tools_root=%~1'
          Set-Content -Path $p -Value $c -NoNewline
          Write-Host "Patched cakewallet.bat"

      - name: Run cakewallet.bat
        shell: cmd
        run: cakewallet.bat "${{ steps.vcredist.outputs.path }}"

      - name: Download VC++ Redistributable for installer
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://aka.ms/vs/17/release/vc_redist.x64.exe" -OutFile "scripts\windows\vc_redist.x64.exe"

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build installer (Inno Setup)
        shell: cmd
        working-directory: scripts\windows
        run: '"C:\Program Files (x86)\Inno Setup 6\ISCC.exe" build_exe_installer.iss'

      - name: Rename installer
        shell: pwsh
        run: |
          $ref = "${{ inputs.ref || 'v6.1.2' }}"
          Move-Item "cakewallet_setup.exe" "Cake_Wallet_${ref}_Windows.exe"

      - name: Upload installer
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Cake-Wallet-Installer-${{ inputs.ref || 'v6.1.2' }}
          path: "Cake_Wallet_*_Windows.exe"
          retention-days: 90
          if-no-files-found: error
